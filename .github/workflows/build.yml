name: Build Store App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project StoreSigner.xcodeproj \
                   -scheme StoreSigner \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   archive -archivePath build/StoreSigner.xcarchive

    - name: Create IPA Package
      run: |
        mkdir -p build/Payload
        cp -r build/StoreSigner.xcarchive/Products/Applications/*.app build/Payload/
        cd build && zip -qr StoreSigner.ipa Payload

    - name: Export Artifact (Download IPA)
      uses: actions/upload-artifact@v4
      with:
        name: iCerf-App
        path: build/StoreSigner.ipa
