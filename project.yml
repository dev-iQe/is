name: StoreSigner
options:
  bundleIdPrefix: com.mystore
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0
targets:
  StoreSigner:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.mystore.storesigner
        INFOPLIST_FILE: Sources/Info.plist
